name: Kitchen regression tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  kitchen-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run kitchen regression tests
        run: python -m pytest -q tests/test_kitchen.py tests/test_order_tour.py tests/test_practice_database.py
      - name: Validate kitchen tour JavaScript
        run: |
          node --check static/order_tour.js
          node --check static/order_flow_tour_steps.js
          node --check static/kitchen_ui.js

  postgres-practice-import:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: practice_test
          POSTGRES_PASSWORD: practice_test
          POSTGRES_DB: practice_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U practice_test -d practice_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PRACTICE_POSTGRES_TEST_URL: postgresql+psycopg2://practice_test:practice_test@localhost:5432/practice_test_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Initialize Supabase-compatible roles in disposable PostgreSQL
        env:
          PGPASSWORD: practice_test
        run: |
          psql -h localhost -U practice_test -d practice_test_db -c "CREATE ROLE anon NOLOGIN;"
          psql -h localhost -U practice_test -d practice_test_db -c "CREATE ROLE authenticated NOLOGIN;"
      - name: Check private PostgreSQL recipe overlay and full menu import
        run: python -m pytest -q tests/test_practice_database.py -k postgres
