name: Kitchen regression tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  kitchen-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run kitchen regression tests
        run: python -m pytest -q tests/test_kitchen.py tests/test_order_tour.py
      - name: Validate kitchen tour JavaScript
        run: |
          node --check static/order_tour.js
          node --check static/order_flow_tour_steps.js
